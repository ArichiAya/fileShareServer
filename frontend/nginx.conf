worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server {
        listen       8686;
        server_name  localhost;

        client_max_body_size 10000m;  # 允许上传最大 10 GB

        # 前端静态文件
        root   G:/fileShareServer/frontend/dist;
        index  index.html;

        # API 反向代理到 Go 后端
        location /upload    { proxy_pass http://127.0.0.1:8666; }
        location /download  { proxy_pass http://127.0.0.1:8666; }
        location /listfiles { proxy_pass http://127.0.0.1:8666; }
        location /delete    { proxy_pass http://127.0.0.1:8666; }
        location /restore   { proxy_pass http://127.0.0.1:8666; }
        location /clean     { proxy_pass http://127.0.0.1:8666; }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
